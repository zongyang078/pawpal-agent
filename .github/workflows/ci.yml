name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject claims to support; the ceiling is what
        # development happens on. Both have to keep working.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: coverage run -m pytest

      - name: Coverage
        run: |
          coverage report
          coverage report --fail-under=80

      - name: Evaluate
        # Guards against a change that keeps every test green while quietly
        # degrading intent, retrieval, or guardrail quality. The floor sits
        # just under the current intent accuracy of 68%, which is the weakest
        # headline metric.
        run: python -m evals.run --show-errors --fail-under=0.65
